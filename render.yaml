# Render Blueprint for the ABD News backend (Django API)
# Render dashboard -> New -> Blueprint -> select this repo
databases:
  - name: abdnews-db
    plan: free
    databaseName: abdnews
    user: abdnews

services:
  - type: web
    name: abdnews-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/news/categories/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: abdnews-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: abdnews-7swb.vercel.app,abdnews.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://abdnews-7swb.vercel.app,https://abdnews.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://abdnews-7swb.vercel.app,https://abdnews.vercel.app
      - key: SITE_URL
        value: https://abdnews-7swb.vercel.app
      - key: SEED_DATA
        value: "true"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
